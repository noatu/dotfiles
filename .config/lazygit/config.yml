promptToReturnFromSubprocess: false
gui:
  # One of 'rounded' (default) | 'single' | 'double' | 'hidden' | 'bold'
  border: single
git:
  autoFetch: false
  overrideGpg: true
  diffRenderers:
    - command: delta --paging=never
    - command: delta --paging=never --side-by-side --line-numbers
    # - externalDiffCommand: difft --color=always --display=inline --context=5
    - command: difft --color=always --context=5
      type: extDiff
  # colorArg: always
